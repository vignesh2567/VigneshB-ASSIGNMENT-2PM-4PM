<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dark Mode</title>
  </head>
  <body>
    <button onclick="toggleMode()">Toggle Dark Mode</button>

    <script>
      function toggleMode() {
        document.body.classList.toggle("dark");
      }
    </script>

    <style>
      .dark {
        background-color: black;
        color: white;
      }
    </style>
  </body>
</html>
