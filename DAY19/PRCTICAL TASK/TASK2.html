<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greeting System</title>
</head>
<body>
  <div class="box">
    <h2>Greeting System</h2>
    <input type="text" id="username" placeholder="Enter your name">
    <button onclick="greetUser()">ENTER</button>
    <p id="greeting"></p>
  </div>
  <script>
    function greetUser() {
      let name = document.getElementById("username").value.trim();
      if (name === "") {
        document.getElementById("greeting").innerText =
          "Please enter your name!";
        return;
      }
      document.getElementById("greeting").innerText =
        "Hello, " + name + "! Welcome 😊";
    }
  </script>
</body>
</html>
