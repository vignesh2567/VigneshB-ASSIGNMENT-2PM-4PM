<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Comparison</title>
  <style>
    div{
      width: 150px;
      height: 100px;
      background-color: orange;
      margin: 20px;
    }
    #o{
        border: 5px solid black;
        
    }
     #t{
        border: 5px dashed black;
    }
     #th{
        border: 5px double black;
    }
  </style>
</head>
<body>
  <div class="box1" id="o">Box 1</div>
  <div class="box2" id="t">Box 2</div>
  <div class="box2" id="th">Box 3</div>
</body>
</html>
