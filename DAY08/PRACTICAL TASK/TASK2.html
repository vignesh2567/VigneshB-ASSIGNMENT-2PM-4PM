<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <style>
      .container {
        display: flex;
        gap: 20px;
        margin: 40px;
        font-family: Arial;
      }
      .plan {
        width: 180px;
        padding: 15px;
        text-align: center;
      }
      #basic {
        border: 2px solid gray;
      }
      #standard {
        border: 2px dashed blue;
      }
      #premium {
        border: 3px double green;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="plan" id="basic">
        <h3>Basic</h3>
        <p>₹199 / month</p>
      </div>
      <div class="plan" id="standard">
        <h3>Standard</h3>
        <p>₹399 / month</p>
      </div>
      <div class="plan"  id="premium">
        <h3>Premium</h3>
        <p>₹599 / month</p>
      </div>
    </div>
  </body>
</html>
