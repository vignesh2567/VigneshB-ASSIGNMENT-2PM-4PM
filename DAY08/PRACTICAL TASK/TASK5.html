<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Box Layout</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .container {
        display: flex;
        gap: 15px;
        margin: 30px;
        font-family: Arial;
      }
      .box {
        width: 150px;
        padding: 15px;
        border: 2px solid black;
        background-color: lightgray;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</html>
