<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
      .card {
        width: 250px;
        border: 1px solid #333;
        margin: 40px;
        padding: 15px;
        font-family: Arial;
        background-color: black;
        color: orchid;
      }
      h3 {
        margin: 5px;
      }
      p {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>VIGNESH</h3>
      <p>WEB DEVELOPER</p>
      <p>BCA AI & Data Science</p>
    </div>
  </body>
</html>
