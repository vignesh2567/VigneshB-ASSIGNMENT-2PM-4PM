<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Toolbar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
      }
      .toolbar {
        height: 60px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 20px;
        background: lightyellow;
      }
      .filters {
        display: flex;
        gap: 10px;
      }
      .search {
        margin: 0 auto;
      }
      .search input {
        padding: 6px 10px;
        width: 220px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="filters">
        <button>Status</button>
        <button>Date</button>
      </div>
      <div class="search">
        <input type="text" placeholder="Search..." />
      </div>
      <div class="actions">
        <button>Add</button>
        <button>Export</button>
      </div>
    </div>
  </body>
</html>
