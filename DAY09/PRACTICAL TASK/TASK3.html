<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        font-family: Arial, sans-serif;
      }
      .chat-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        display: flex;
        flex-direction: column-reverse;
        overflow-y: auto;
        padding: 10px;
        background: #f2f2f2;
      }
      .message {
        background: white;
        padding: 8px 12px;
        margin-bottom: 8px;
        border-radius: 6px;
        width: fit-content;
      }
      .input-bar {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ccc;
        background: #fff;
      }
      .input-bar input {
        flex: 1;
        padding: 8px;
      }
      .input-bar button {
        margin-left: 8px;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="messages">
        <div class="message">Hello 👋</div>
        <div class="message">How are you?</div>
        <div class="message">This is a chat layout</div>
      </div>
      <div class="input-bar">
        <input type="text" placeholder="Type a message..." />
        <button>Send</button>
      </div>
    </div>
  </body>
</html>
