<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOOL BAR</title>
    <style>
      .toolbar {
        height: 60px;
        background: #222;
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .toolbar button {
        padding: 8px 16px;
        border: none;
        background: #555;
        color: white;
        cursor: pointer;
      }
      .center {
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button class="left">Left</button>
      <button class="center">Center</button>
      <button class="right">Right</button>
    </div>
  </body>
</html>
