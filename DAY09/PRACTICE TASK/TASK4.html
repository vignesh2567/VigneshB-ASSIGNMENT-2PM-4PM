<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        height: 100vh; 
        display: flex;
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        gap: 15px;
      }
      .box {
        width: 200px;
        height: 60px;
        background: #333;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Block 1</div>
      <div class="box">Block 2</div>
      <div class="box">Block 3</div>
    </div>
  </body>
</html>
