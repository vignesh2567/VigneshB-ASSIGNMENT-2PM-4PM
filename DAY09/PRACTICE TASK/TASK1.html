<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>navigation</title>
    <style>
      body {
        margin: 0;
      }
      .navbar {
        height: 60px;
        background-color: black;

        display: flex;
        justify-content: center; 
        align-items: center; 
      }
      .navbar ul {
        list-style: none;
        display: flex;
        gap: 30px;
        padding: 0;
        margin: 0;
      }
      .navbar li {
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
      </ul>
    </nav>
  </body>
</html>
