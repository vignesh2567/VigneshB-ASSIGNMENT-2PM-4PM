<!DOCTYPE html>
<html>
<body>

<div id="box" style="width:200px;height:200px;background:gray;"></div>

<script>
let box = document.getElementById("box");

box.addEventListener("click", () => box.style.background = "red");
box.addEventListener("dblclick", () => box.style.background = "green");
box.addEventListener("mouseover", () => box.style.background = "blue");
</script>

</body>
</html>
