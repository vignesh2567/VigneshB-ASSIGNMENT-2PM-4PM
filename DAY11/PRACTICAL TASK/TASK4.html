<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      .title {
        text-align: center;
        margin-bottom: 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h2 class="title">CAPTAIN AMERICA</h2>
    <div class="gallery">
      <img src="./ca1.png" alt="Campus Image 1" />
      <img src="./ca2.png" alt="Campus Image 2" />
      <img src="./CPA1.jpg" alt="Campus Image 3" />
      <img src="./CPA2.jpg" alt="Campus Image 4" />
      <img src="./CPA3.jpg" alt="Campus Image 5" />
      <img src="./CA7.jpg" alt="Campus Image 6" />
    </div>
  </body>
</html>
