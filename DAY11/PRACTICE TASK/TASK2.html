<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Image Left</title>
    <style>
      .content {
        width: 80%;
        margin: 20px auto;
        font-family: Arial, sans-serif;
      }
      .float-img {
        float: left;
        margin: 0 15px 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <img
        src="./ca1.png"
        alt="Sample Image"
        class="float-img"
        height="150px"
        width="150px"
      />
      <p>
        This paragraph wraps around the image. The image is floated to the left,
        so the text flows naturally on the right side and below the image. This
        technique was commonly used in older website layouts and is still useful
        for articles and blogs.
      </p>
    </div>
  </body>
</html>
