<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block vs Inline</title>
    <style>
      .block-box {
        background: #333;
        color: white;
        padding: 15px;
        margin-bottom: 20px;
      }
      .inline-box {
        background: yellow;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div class="block-box">This is a block element (takes full width)</div>
    <p>
      This is a paragraph with an
      <span class="inline-box">inline element</span>
      beside the text.
    </p>
  </body>
</html>
