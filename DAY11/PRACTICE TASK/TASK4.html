<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Align Self Example</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .flex-container {
        display: flex;
        align-items: center;
        height: 200px;
        border: 2px solid #333;
        padding: 10px;
      }
      .item {
        padding: 10px 15px;
        background: #ccc;
        margin-right: 10px;
      }
      .special {
        align-self: flex-end;
        background: #999;
      }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <div class="item">Item 1</div>
      <div class="item special">Item 2</div>
      <div class="item">Item 3</div>
    </div>
  </body>
</html>
