<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image</title>
    <style>
      .photo {
        width: 400px;
        max-width: 100%;
        display: block;
        margin: 30px auto;
      }
      @media (max-width: 480px) {
        .photo {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img src="./tuff17.jpg" class="photo" alt="Sample Image" />
  </body>
</html>
