<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 to 1 Column Layout</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 40px;
      }
      .box {
        background: #4f46e5;
        color: white;
        padding: 40px;
        text-align: center;
        border-radius: 8px;
      }
      @media (max-width: 600px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Column 1</div>
      <div class="box">Column 2</div>
    </div>
  </body>
</html>
