<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Display</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .header {
        text-align: center;
        padding: 30px;
        background: #4f46e5;
        color: white;
      }
      .products {
        padding: 40px 10%;
        background: #f3f4f6;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }
      .product-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      .product-card img {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      .product-card h3 {
        margin-bottom: 10px;
      }
      .price {
        font-weight: bold;
        color: #4f46e5;
        margin-bottom: 15px;
      }
      .product-card button {
        padding: 10px 20px;
        border: none;
        background: #4f46e5;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }
      .product-card button:hover {
        background: #4338ca;
      }
      @media (max-width: 480px) {
        .products {
          padding: 30px 5%;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1>Our Products</h1>
    </header>
    <section class="products">
      <div class="product-grid">
        <div class="product-card">
          <img src="./tuff17.jpg"Product" />
          <h3>ASUS F17</h3>
          <p class="price">₹49,999</p>
          <button>Add to Cart</button>
        </div>
        <div class="product-card">
          <img src="./loq.jpg"Product" />
          <h3>LENOVA LOQ?</h3>
          <p class="price">₹69,999</p>
          <button>Add to Cart</button>
        </div>
        <div class="product-card">
          <img src="./tufa15.jpg"Product" />
          <h3>ASUS A15</h3>
          <p class="price">₹66,999</p>
          <button>Add to Cart</button>
        </div>
        <div class="product-card">
          <img src="./victus.jpg"Product" />
          <h3>VICTUS</h3>
          <p class="price">₹57,999</p>
          <button>Add to Cart</button>
        </div>
      </div>
    </section>
  </body>
</html>
