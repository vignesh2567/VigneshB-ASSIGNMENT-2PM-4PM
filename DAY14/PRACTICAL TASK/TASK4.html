<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Footer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
       .footer {
        background: #111827;
        color: #e5e7eb;
        padding: 50px 10% 20px;
      }
      .footer-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .footer-col h3 {
        margin-bottom: 15px;
        color: #ffffff;
      }
      .footer-col p,
      .footer-col li {
        font-size: 0.95rem;
        line-height: 1.6;
        list-style: none;
      }
      .footer-col ul li {
        margin-bottom: 8px;
      }
      @media (max-width: 900px) {
        .footer-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 500px) {
        .footer-grid {
          grid-template-columns: 1fr;
          text-align: center;
        }
      }
      .footer-bottom {
        text-align: center;
        margin-top: 30px;
        font-size: 0.85rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h3>About</h3>
          <p>We build modern, responsive websites with clean design.</p>
        </div>
        <div class="footer-col">
          <h3>Services</h3>
          <ul>
            <li>Web Design</li>
            <li>Development</li>
            <li>SEO</li>
          </ul>
        </div>
        <div class="footer-col">
          <h3>Links</h3>
          <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
          </ul>
        </div>
        <div class="footer-col">
          <h3>Contact</h3>
          <p>Email: info@example.com</p>
          <p>Phone: +91 12345 67890</p>
        </div>
      </div>
      <p class="footer-bottom">© 2026 Your Company. All rights reserved.</p>
    </footer>
  </body>
</html>
