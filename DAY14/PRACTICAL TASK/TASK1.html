<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Hero Section</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 60px 10%;
        min-height: 100vh;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: white;
        gap: 40px;
      }
      .hero-content {
        max-width: 500px;
      }
      .hero-content h1 {
        font-size: 3rem;
        margin-bottom: 20px;
      }
      .hero-content p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .hero-content button {
        padding: 12px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        background: white;
        color: #4f46e5;
        cursor: pointer;
      }
      .hero-content button:hover {
        background: #e5e7eb;
      }
      .hero-image img {
        width: 100%;
        max-width: 500px;
        border-radius: 50%;
      }
      @media (max-width: 768px) {
        .hero {
          flex-direction: column;
          text-align: center;
        }

        .hero-content h1 {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h1>Build Better Websites</h1>
        <p>
          Learn modern web development with simple, clean, and responsive
          layouts.
        </p>
        <button>Get Started</button>
      </div>
      <div class="hero-image">
        <img src="./GHPPF.jpg" alt="Hero Image" />
      </div>
    </section>
  </body>
</html>
