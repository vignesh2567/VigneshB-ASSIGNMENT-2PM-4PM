<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services Section</title>
    <style>
      .services {
        padding: 60px 10%;
        background: #f9fafb;
        text-align: center;
      }
      .services h2 {
        font-size: 2.2rem;
        margin-bottom: 40px;
      }
      .service-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .service-card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      .service-card h3 {
        margin-bottom: 15px;
        color: #4f46e5;
      }
      .service-card p {
        color: #555;
        line-height: 1.5;
      }
      @media (max-width: 900px) {
        .service-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .service-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <section class="services">
      <h2>Our Services</h2>
      <div class="service-grid">
        <div class="service-card">
          <h3>Web Design</h3>
          <p>Modern, responsive, and user-friendly website designs.</p>
        </div>
        <div class="service-card">
          <h3>Development</h3>
          <p>Fast and scalable web applications using latest tech.</p>
        </div>
        <div class="service-card">
          <h3>SEO Optimization</h3>
          <p>Improve visibility and ranking on search engines.</p>
        </div>
      </div>
    </section>
  </body>
</html>
