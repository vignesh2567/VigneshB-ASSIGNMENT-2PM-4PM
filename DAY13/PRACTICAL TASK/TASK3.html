<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Grid</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }
      .product {
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
        background: #fff;
      }
      .product button {
        margin-top: 10px;
        padding: 8px 16px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2 class="title">Products</h2>
    <div class="product-grid">
      <div class="product">
        <h3>Product 1</h3>
        <p>₹499</p>
        <button>Buy</button>
      </div>
      <div class="product">
        <h3>Product 2</h3>
        <p>₹799</p>
        <button>Buy</button>
      </div>
      <div class="product">
        <h3>Product 3</h3>
        <p>₹299</p>
        <button>Buy</button>
      </div>
      <div class="product">
        <h3>Product 4</h3>
        <p>₹999</p>
        <button>Buy</button>
      </div>
    </div>
  </body>
</html>
