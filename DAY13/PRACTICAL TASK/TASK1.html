<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h2 class="title">Photo Gallery</h2>
    <div class="gallery">
      <img src="./ca1.png" />
      <img src="./ca2.png" />
      <img src="./CPA2.jpg" />
    </div>
  </body>
</html>
