<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .span {
        grid-column: span 2;
      }
      .box {
        background: #dcdcdc;
        padding: 30px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="box span">Item 1 (spans 2 columns)</div>
      <div class="box">Item 2</div>
      <div class="box">Item 3</div>
      <div class="box">Item 4</div>
    </div>
  </body>
</html>
