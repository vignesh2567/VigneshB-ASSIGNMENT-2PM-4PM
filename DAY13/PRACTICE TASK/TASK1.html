<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 Column Grid</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .box {
        background: #e0e0e0;
        padding: 40px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="box">Column 1</div>
      <div class="box">Column 2</div>
    </div>
  </body>
</html>
