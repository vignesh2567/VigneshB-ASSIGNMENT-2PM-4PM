<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Paragraph</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"rel="stylesheet"/>
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: #f4f4f4;
        padding: 40px;
      }
      p {
        max-width: 600px;
        font-size: 18px;
        line-height: 1.8;
        letter-spacing: 0.5px;
        word-spacing: 2px;

        color: #333;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <p>
      This paragraph uses a custom Google Font with proper spacing. Adjusting
      line height, letter spacing, and word spacing makes text easier to read
      and more visually pleasing.
    </p>
  </body>
</html>
