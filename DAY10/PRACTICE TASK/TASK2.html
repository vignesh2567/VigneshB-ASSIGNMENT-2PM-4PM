<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linear Gradient Section</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .gradient-section {
        padding: 80px 20px;
        text-align: center;
        color: white;
        background: linear-gradient(120deg, #667eea, #764ba2);
      }
      .gradient-section h1 {
        margin-bottom: 10px;
        font-size: 36px;
      }
      .gradient-section p {
        font-size: 18px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <section class="gradient-section">
      <h1>Gradient Section</h1>
      <p>This section uses a linear gradient background</p>
    </section>
  </body>
</html>
