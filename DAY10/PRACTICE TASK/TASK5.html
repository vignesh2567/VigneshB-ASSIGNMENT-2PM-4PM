<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Bottom Right</title>
    <style>
      body {
        height: 2000px;
        font-family: Arial, sans-serif;
      }
      .fixed-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #4caf50;
        color: white;
        padding: 15px 20px;
        border-radius: 30px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Scroll the page and the box stays fixed.</p>
    <div class="fixed-box">Chat</div>
  </body>
</html>
