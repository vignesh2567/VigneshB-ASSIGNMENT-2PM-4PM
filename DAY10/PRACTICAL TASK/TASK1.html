<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"rel="stylesheet"/>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: "Poppins", sans-serif;
      }
      .card {
        width: 280px;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        color: white;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }
      .card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid white;
        margin-bottom: 10px;
      }
      .card h2 {
        margin: 10px 0 5px;
        font-weight: 600;
      }
      .card p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./GHPPF.jpg" alt="Profile" />
      <h2>Vicky</h2>
      <p>BCA AI & Data Science</p>
    </div>
  </body>
</html>
