<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Montserrat", sans-serif;
      }
      .hero {
        height: 100vh;
        background: linear-gradient(135deg, #1d2671, #c33764);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
      }
      .hero h1 {
        font-size: 56px;
        margin-bottom: 15px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      }
      .hero h1 span {
        color: #ffd700;
      }
      .hero p {
        font-size: 20px;
        max-width: 600px;
        margin: auto;
        opacity: 0.9;
      }
      .hero button {
        margin-top: 25px;
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 25px;
        background: #ffd700;
        cursor: pointer;
        font-weight: 600;
      }
      .hero button:hover {
        background: #ffcc00;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div>
        <h1>Build Your <span>Future</span></h1>
        <p>Learn web development and design modern websites with confidence.</p>
        <button>Get Started</button>
      </div>
    </section>
  </body>
</html>
