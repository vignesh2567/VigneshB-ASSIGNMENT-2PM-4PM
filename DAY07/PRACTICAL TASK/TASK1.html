<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    body{
        background-color: lavender;
    }
    .logb{
      width: 350px;
      margin: 100px auto;
      padding: 20px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="logb">
    <h2>Login</h2>
    <label>Email:</label>
    <input type="email" placeholder="Enter your email">
    <label>Password:</label>
    <input type="password" placeholder="Enter your password">
    <button>Login</button>
  </div>
</body>
</html>
