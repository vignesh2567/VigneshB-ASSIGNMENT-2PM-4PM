<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLING WITH SELECTORS</title>
    <style>
        h1{
            color:blueviolet;
        }
        .BOX{
            background-color: black;
            color: green;
            height: 130px;
            width: 130px;
        }
        #ITEM{
            color: red;
        }
    </style>
</head>
<body>
    <h1>STYLING using CLASS AND ID</h1>
    <div class="BOX">
        A CONTAINER
        <div id="ITEM">Item inside a container</div>
    </div>
</body>
</html>
