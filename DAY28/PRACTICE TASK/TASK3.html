<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="mb-4 p-3 bg-primary text-white text-center">
      Box with margin-bottom (mb-4) and padding (p-3)
    </div>
    <div class="p-5 bg-success text-white text-center mb-3">
      Box with padding all sides (p-5)
    </div>
    <div class="px-4 py-2 bg-warning text-dark text-center">
      Box with horizontal padding (px-4) and vertical padding (py-2)
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
