<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Center Text with Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="text-center p-4 bg-primary text-white mb-4">
        This text is centered horizontally
      </div>
      <div class="text-center text-md-start p-4 bg-success text-white mb-4">
        Centered on mobile, left-aligned on desktop
      </div>
      <div class="card text-center p-3">
        <h3 class="mb-2">Centered Heading</h3>
        <p class="text-muted">This card content is centered</p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
