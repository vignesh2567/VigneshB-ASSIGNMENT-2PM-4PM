<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image</title>
    <style>
      .img {
        width: 400px;
        max-width: 100%;
        display: block;
        margin: 30px auto;
      }
      @media (max-width: 600px) {
        .img {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img src="./GHPPF.jpg" class="img" alt="Responsive Image" />
  </body>
</html>
