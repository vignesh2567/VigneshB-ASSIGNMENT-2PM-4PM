<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Box</title>
    <style>
      .box {
        width: 300px;
        height: 150px;
        background: #4f46e5;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 40px auto;
        border-radius: 8px;
      }
      @media (max-width: 600px) {
        .box {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">Responsive Box</div>
  </body>
</html>
