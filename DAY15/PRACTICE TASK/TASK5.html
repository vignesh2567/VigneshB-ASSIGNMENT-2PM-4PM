<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 250px;
        background: #111827;
        color: white;
        padding: 20px;
      }
      .content {
        flex: 1;
        padding: 30px;
      }
      @media (max-width: 700px) {
        .sidebar {
          display: none;
        }
      }
    </style>
    <title>Hide Sidebar</title>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <p>Dashboard</p>
        <p>Profile</p>
        <p>Settings</p>
      </aside>
      <main class="content">
        <h1>Main Content</h1>
      </main>
    </div>
  </body>
</html>
