<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .services {
        padding: 60px 10%;
        background: #f3f4f6;
        text-align: center;
      }
      .services h2 {
        font-size: 2rem;
        margin-bottom: 40px;
      }
      .services-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .service-card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      .service-card h3 {
        margin-bottom: 15px;
        color: #4f46e5;
      }
      .service-card p {
        color: #555;
        line-height: 1.5;
      }
      @media (max-width: 900px) {
        .services-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .services-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <section class="services">
      <h2>Our Services</h2>
      <div class="services-grid">
        <div class="service-card">
          <h3>Web Design</h3>
          <p>Clean and modern website designs.</p>
        </div>
        <div class="service-card">
          <h3>Development</h3>
          <p>Fast and responsive web applications.</p>
        </div>
        <div class="service-card">
          <h3>SEO</h3>
          <p>Improve website visibility and ranking.</p>
        </div>
      </div>
    </section>
  </body>
</html>
