<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .gallery {
        padding: 60px 10%;
        background: #f3f4f6;
        text-align: center;
      }
      .gallery h2 {
        margin-bottom: 30px;
        font-size: 2rem;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }
      .gallery-grid img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <section class="gallery">
      <h2>Photo Gallery</h2>
      <div class="gallery-grid">
        <img src="./ca1.png" alt="Photo 1" />
        <img src="./ca2.png" alt="Photo 2" />
        <img src="./CPA1.jpg" alt="Photo 3" />
        <img src="./CPA2.jpg" alt="Photo 4" />
        <img src="./CPA3.jpg" alt="Photo 5" />
        <img src="./GHPPF.jpg" alt="Photo 6" />
      </div>
    </section>
  </body>
</html>
