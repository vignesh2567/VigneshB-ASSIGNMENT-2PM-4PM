<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Pricing Table</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .pricing {
        padding: 60px 10%;
        background: #f3f4f6;
        text-align: center;
      }
      .pricing h2 {
        font-size: 2.2rem;
        margin-bottom: 40px;
      }
      .pricing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .plan {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      .plan h3 {
        margin-bottom: 10px;
      }
      .price {
        font-size: 1.5rem;
        color: #4f46e5;
        margin: 15px 0;
      }
      .plan ul {
        list-style: none;
        margin-bottom: 20px;
      }
      .plan ul li {
        margin: 8px 0;
      }
      .plan button {
        padding: 10px 22px;
        border: none;
        border-radius: 6px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }
      .plan button:hover {
        background: #4338ca;
      }
      .popular {
        border: 2px solid #4f46e5;
        transform: scale(1.05);
      }
      @media (max-width: 900px) {
        .pricing-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .pricing-grid {
          grid-template-columns: 1fr;
        }
        .popular {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <section class="pricing">
      <h2>Pricing Plans</h2>
      <div class="pricing-grid">
        <div class="plan">
          <h3>Basic</h3>
          <p class="price">₹499 / mo</p>
          <ul>
            <li>1 Website</li>
            <li>Basic Support</li>
            <li>5 GB Storage</li>
          </ul>
          <button>Choose Plan</button>
        </div>
        <div class="plan popular">
          <h3>Standard</h3>
          <p class="price">₹999 / mo</p>
          <ul>
            <li>5 Websites</li>
            <li>Priority Support</li>
            <li>50 GB Storage</li>
          </ul>
          <button>Choose Plan</button>
        </div>
        <div class="plan">
          <h3>Premium</h3>
          <p class="price">₹1499 / mo</p>
          <ul>
            <li>Unlimited Websites</li>
            <li>24/7 Support</li>
            <li>Unlimited Storage</li>
          </ul>
          <button>Choose Plan</button>
        </div>
      </div>
    </section>
  </body>
</html>
